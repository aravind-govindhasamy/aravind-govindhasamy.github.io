name: Build and Deploy Hugo Blog

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      # 2️⃣ Setup Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.148.2'
          extended: true

      # 3️⃣ Build Hugo blog into 'blog-output'
      - name: Build Hugo site
        run: |
          hugo --source blog --destination blog-output --minify --baseURL "https://aravind-govindhasamy.github.io/blog/"

      # 4️⃣ Deploy static files to 'blog/' folder
      - name: Deploy Hugo blog
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add blog
          git commit -m "Deploy Hugo blog" || echo "No changes to commit"
          git push
