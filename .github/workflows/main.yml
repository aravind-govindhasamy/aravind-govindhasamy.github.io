name: Build and Deploy Hugo Blog

on:
  push:
    branches:
      - main  # Trigger build on main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository with submodules
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      # 2️⃣ Setup Hugo (extended version for SCSS/SASS)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.148.2'
          extended: true

      # 3️⃣ Build Hugo site into blog-output
      - name: Build Hugo site
        run: |
          hugo --source blog \
               --destination blog-output \
               --minify \
               --baseURL "https://aravind-govindhasamy.github.io/blog/"

      # 4️⃣ Deploy to gh-pages branch using PAT
      - name: Deploy Hugo blog
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}   # <-- Add your PAT here
          publish_dir: ./blog-output
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions
          user_email: github-actions@github.com
